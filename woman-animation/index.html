<title>Woman, a Ballad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Holtwood+One+SC&family=Special+Elite&family=Rye&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #0f0c09;
    --ink-2: #1c1611;
    --line: #3a2e22;
    --bone: #f1e6cc;
    --muted: #b3a283;
    --amber: #e3a23c;
    --rust: #d9482a;
    --display: "Holtwood One SC", "Rockwell", Georgia, serif;
    --type: "Special Elite", "Courier New", monospace;
  }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--bone);
    font-family: var(--type);
    padding-inline: 16px;
    padding-block: 20px 28px;
    box-sizing: border-box;
  }
  .wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 14px; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; }
  .head h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 4vw, 38px); letter-spacing: 0.04em; margin: 0; line-height: 1; }
  .head p { margin: 0; color: var(--muted); font-size: 14px; letter-spacing: 0.02em; }
  .screen { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background: #000; border: 1px solid var(--line); box-shadow: 0 30px 80px -30px rgba(0,0,0,.9); overflow: hidden; }
  .screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .big {
    position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%);
    font-family: var(--display); font-size: clamp(15px, 2.2vw, 22px); letter-spacing: 0.06em;
    color: var(--ink); background: var(--bone); border: 0; padding: 0.7em 1.3em 0.6em; cursor: pointer;
    box-shadow: 5px 6px 0 var(--rust);
  }
  .big:hover { background: #fff6e2; }
  .big:focus-visible, .ctl:focus-visible, .chip:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
  .controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .ctl {
    font-family: var(--type); font-size: 15px; color: var(--bone); background: var(--ink-2);
    border: 1px solid var(--line); padding: 8px 14px; cursor: pointer; min-width: 84px;
  }
  .ctl:hover { border-color: var(--muted); }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; min-width: 96px; }
  .scrub { flex: 1 1 260px; min-width: 0; }
  input[type=range] { width: 100%; accent-color: var(--rust); margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-family: var(--type); font-size: 13px; color: var(--muted); background: transparent;
    border: 1px solid var(--line); padding: 4px 9px; cursor: pointer;
  }
  .chip[aria-current="true"] { color: var(--ink); background: var(--amber); border-color: var(--amber); }
  .note { color: var(--muted); font-size: 13px; margin: 0; }
</style>

<div class="wrap">
  <header class="head">
    <h1>Woman</h1>
    <p>A ballad in black &middot; words by a very discerning young songwriter</p>
  </header>

  <div class="screen" id="screen">
    <canvas id="c" aria-label="Animated film for the song Woman"></canvas>
    <button class="big" id="big" type="button">&#9654;&ensp;Play with sound</button>
  </div>

  <div class="controls">
    <button class="ctl" id="pp" type="button">Play</button>
    <span class="time" id="time">0:00 / 0:35</span>
    <div class="scrub"><input type="range" id="scrub" min="0" max="35" step="0.01" value="0" aria-label="Seek"></div>
    <button class="ctl" id="fs" type="button">Full screen</button>
  </div>
  <nav class="chips" id="chips" aria-label="Scenes"></nav>
  <p class="note">Space plays and pauses. Arrow keys skip two seconds.</p>
</div>

<audio id="au" src="woman.mp3" preload="auto"></audio>

<script>
(() => {
const W = 1600, H = 900, TAU = Math.PI * 2;
const C = {
  ink: '#16110c', ink2: '#2a1f16', umber: '#5b4431', sepia: '#9a7a4f', paper: '#dccaa3',
  bone: '#f1e6cc', amber: '#e3a23c', rust: '#b3361f', red: '#dd4b2c', dusk: '#3d2a1c', ember: '#8a3a1f'
};
const DISPLAY = '"Holtwood One SC", Rockwell, Georgia, serif';
const TYPE = '"Special Elite", "Courier New", monospace';
const WEST = '"Rye", "Holtwood One SC", Georgia, serif';
const DUR = 34.96;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const BEATS = [0.39,0.77,1.14,1.51,1.9,2.3,2.69,3.09,3.48,3.85,4.23,4.6,4.99,5.39,5.78,6.15,6.55,6.94,7.34,7.71,8.08,8.48,8.87,9.24,9.64,10.01,10.4,10.77,11.17,11.54,11.94,12.31,12.7,13.05,13.42,13.79,14.21,14.61,15.02,15.37,15.77,16.16,16.53,16.9,17.32,17.69,18.07,18.44,18.83,19.2,19.6,19.97,20.34,20.74,21.13,21.52,21.92,22.31,22.69,23.08,23.45,23.82,24.24,24.64,25.03,25.4,25.8,26.17,26.56,26.96,27.35,27.72,28.1,28.49,28.89,29.26,29.63,30.02,30.42,30.8,31.18,31.56,31.94,32.32];

// ---------- lyric timing (sung word onsets, seconds) ----------
const L = {
  seen:   [['have',6.10],['you',6.48],['ever',6.70],['seen',7.02],['a',7.38],['woman?',7.62,1]],
  know:   [['I',9.82],['know',10.34],['I',10.52],['have!',10.72,1,1.35]],
  ifA:    [['If',12.40],['you',12.68],["haven't,",12.84]],
  ifB:    [['you',13.46],['were',13.54],['probably',13.70]],
  raised: [['raised',14.14],['in',14.92],['a',15.16],['prison.',15.30,1,1.5]],
  wl:     [['Woman',17.98],['like',18.84]],
  bionic: [['bionic',19.20,1],['eyeballs,',19.84,1]],
  they:   [['They',23.36],['like',23.54]],
  inter:  [['interesting',23.76,1],['things!',24.20]],
  ducks:  [['Ducks',25.04,1],['are',25.62],['weird,',25.92,1]],
  notbad: [['but',26.44],['they',26.68],['are',26.92],['not',27.14],['bad.',27.34,1,1.3]],
  nl1:    [['They',28.12],['are',28.24],['not',28.36,1],['like',28.70]],
  nl2:    [['women',29.08],['who',29.42],['eat',29.78]],
  nl3:    [['hotdog',29.98,1],['water.',30.70,1]]
};

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const eOut = k => 1 - Math.pow(1 - k, 3);
const eBack = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const noise1 = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return hash(i) * (1 - u) + hash(i + 1) * u; };
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function lastBeat(t) { let lo = 0, hi = BEATS.length - 1, r = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (BEATS[m] <= t) { r = m; lo = m + 1; } else hi = m - 1; } return r; }
function pulse(t, k = 9) { const i = lastBeat(t); return i < 0 ? 0 : Math.exp(-(t - BEATS[i]) * k); }
function beatPhase(t) { const i = lastBeat(t); if (i < 0 || i >= BEATS.length - 1) return (t / 0.3725) % 1; return (t - BEATS[i]) / (BEATS[i + 1] - BEATS[i]); }

// ---------- canvas ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let DPR = 1, sx = 1;
function resize() {
  const r = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(320, Math.round(r.width * DPR));
  cv.width = Math.min(w, 2400); cv.height = Math.round(cv.width * 9 / 16);
  sx = cv.width / W;
}

// film grain frames
const grain = [];
for (let g = 0; g < 4; g++) {
  const c = document.createElement('canvas'); c.width = 400; c.height = 225;
  const x = c.getContext('2d'), id = x.createImageData(400, 225);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = Math.random() < 0.5 ? 0 : 255;
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = Math.random() * 60;
  }
  x.putImageData(id, 0, 0); grain.push(c);
}
let vignette = null;

// ---------- drawing helpers ----------
function sky(stops, y0 = 0, y1 = H) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  stops.forEach(([o, c]) => g.addColorStop(o, c));
  ctx.fillStyle = g; ctx.fillRect(-80, -80, W + 160, H + 160); return g;
}
function glow(x, y, r, col, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function sun(x, y, r, skyG, n = 7) {
  glow(x, y, r * 2.4, C.amber, 0.35);
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip();
  const g = ctx.createLinearGradient(0, y - r, 0, y + r);
  g.addColorStop(0, '#fbeccd'); g.addColorStop(0.55, C.amber); g.addColorStop(1, C.rust);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  ctx.fillStyle = skyG;
  for (let i = 0; i < n; i++) { const yy = y + r * 0.08 + i * r * 0.14; ctx.fillRect(x - r, yy, r * 2, r * (0.012 + i * 0.019)); }
  ctx.restore();
}
function rays(cx, cy, n, rot, col, a, R = 2400) {
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = col; ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const p = rot + i * TAU / n, q = p + TAU / n / 2;
    ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(p) * R, cy + Math.sin(p) * R); ctx.lineTo(cx + Math.cos(q) * R, cy + Math.sin(q) * R); ctx.closePath();
  }
  ctx.fill(); ctx.restore();
}
function ridge(y0, amp, freq, off, col, mesa) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-80, H + 80);
  for (let x = -80; x <= W + 80; x += 6) {
    let n = noise1(x * freq + off);
    if (mesa) n = smooth(0.42, 0.56, n) * 0.85 + noise1(x * freq * 7 + off) * 0.15;
    ctx.lineTo(x, y0 - n * amp);
  }
  ctx.lineTo(W + 80, H + 80); ctx.closePath(); ctx.fill();
}
function starPath(cx, cy, r1, r2, n, rot = -Math.PI / 2) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) { const r = i % 2 ? r2 : r1, a = rot + i * Math.PI / n; ctx[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
  ctx.closePath();
}
function gearPath(cx, cy, r, teeth, rot) {
  ctx.beginPath();
  for (let i = 0; i < teeth * 4; i++) {
    const a = rot + i * TAU / (teeth * 4), rr = (i % 4 < 2) ? r : r * 0.78;
    ctx[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  ctx.closePath();
}

// word-by-word stamped lyric line. words: [text, onset, highlight, scale]
function line(words, t, cx, y, size, o = {}) {
  const col = o.col || C.bone, hi = o.hi || C.red, sh = o.shadow === undefined ? rgba(C.ink, 0.85) : o.shadow;
  const maxW = o.maxW || W - 170, font = o.font || DISPLAY, align = o.align || 'center';
  const measure = s => {
    let tot = 0; const ws = [];
    words.forEach(w => { ctx.font = `${s * (w[3] || 1)}px ${font}`; const m = ctx.measureText(w[0]).width; ws.push(m); tot += m; });
    return { ws, tot: tot + s * 0.3 * (words.length - 1) };
  };
  let m = measure(size);
  if (m.tot > maxW) { size *= maxW / m.tot; m = measure(size); }
  let x = align === 'left' ? cx : cx - m.tot / 2;
  words.forEach((w, i) => {
    const [txt, on, h, sc = 1] = w, s = size * sc, k = clamp((t - on + 0.03) / 0.16);
    if (k > 0) {
      ctx.save();
      ctx.translate(x + m.ws[i] / 2, y);
      const e = eBack(k), rot = (hash(on * 13) - 0.5) * 0.06;
      ctx.rotate(rot * (1 + (1 - k) * 3));
      ctx.scale(lerp(1.7, 1, e), lerp(1.7, 1, e));
      ctx.globalAlpha = clamp(k * 1.4) * (o.alpha ?? 1);
      ctx.font = `${s}px ${font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      if (sh) { ctx.fillStyle = sh; ctx.fillText(txt, s * 0.05, s * 0.07); }
      ctx.fillStyle = h ? hi : col; ctx.fillText(txt, 0, 0);
      ctx.restore();
    }
    x += m.ws[i] + size * 0.3;
  });
}
function caption(txt, x, y, size, col, align = 'center', font = TYPE, a = 1) {
  ctx.save(); ctx.globalAlpha = a; ctx.font = `${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = col; ctx.fillText(txt, x, y); ctx.restore();
}

// ---------- characters ----------
function woman(x, y, h, t, o = {}) {
  const u = h / 100, wind = o.wind ?? 1, walk = o.walk || 0;
  ctx.save(); ctx.translate(x, y); ctx.scale(o.facing || 1, 1);
  ctx.fillStyle = C.ink; ctx.strokeStyle = C.ink; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const hy = -90 * u;
  for (let i = 0; i < 6; i++) {
    ctx.lineWidth = (5.4 - i * 0.6) * u;
    const L = (17 + i * 3.4) * u * wind, w = Math.sin(t * 6 + i * 0.9) * 2.6 * u;
    ctx.beginPath(); ctx.moveTo(1 * u, hy - 4 * u + i * 2 * u);
    ctx.bezierCurveTo(9 * u, hy + i * 2 * u + w, 4 * u + L * 0.6, hy + i * 3 * u - w, 4 * u + L, hy + (i * 3 + 5) * u + w * 1.6);
    ctx.stroke();
  }
  ctx.beginPath(); ctx.ellipse(0, hy, 6.4 * u, 7.2 * u, 0, 0, TAU); ctx.fill();
  ctx.fillRect(-1.9 * u, hy + 5 * u, 3.8 * u, 7 * u);
  const f1 = Math.sin(t * 5.2) * 2.6 * u * wind, f2 = Math.sin(t * 5.2 + 1.4) * 2.4 * u * wind;
  const sway = Math.sin(walk) * 2 * u;
  ctx.beginPath();
  ctx.moveTo(-8.5 * u, -78 * u); ctx.quadraticCurveTo(0, -81 * u, 8.5 * u, -78 * u);
  ctx.lineTo(5 * u, -57 * u);
  ctx.quadraticCurveTo(10 * u, -30 * u, (14 + 7 * wind) * u + f1 + sway, -1 * u);
  ctx.bezierCurveTo(8 * u, 2 * u + f2, -2 * u, -3 * u, -13 * u + sway, 0);
  ctx.quadraticCurveTo(-9 * u, -30 * u, -5 * u, -57 * u);
  ctx.closePath(); ctx.fill();
  ctx.lineWidth = 3.2 * u;
  ctx.beginPath(); ctx.moveTo(-7.6 * u, -76 * u); ctx.quadraticCurveTo(-11 * u, -64 * u, -10.5 * u + Math.sin(walk) * 3 * u, -51 * u); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(7.6 * u, -76 * u); ctx.quadraticCurveTo(11 * u, -64 * u, 11 * u - Math.sin(walk) * 3 * u, -52 * u); ctx.stroke();
  if (walk) {
    ctx.lineWidth = 3 * u;
    ctx.beginPath(); ctx.moveTo(-3 * u, -2 * u); ctx.lineTo(-3 * u + Math.sin(walk) * 3 * u, 4 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(3 * u, -2 * u); ctx.lineTo(3 * u - Math.sin(walk) * 3 * u, 4 * u); ctx.stroke();
  }
  if (o.scarf !== false) {
    ctx.strokeStyle = C.red; ctx.lineWidth = 2.6 * u;
    for (let r = 0; r < 2; r++) {
      ctx.beginPath(); ctx.moveTo(-2 * u, -80 * u);
      for (let i = 1; i <= 14; i++) {
        const px = i * 3.8 * u * (0.6 + 0.4 * wind), py = -80 * u + i * (0.7 + r * 0.5) * u + Math.sin(t * 8 - i * 0.55 + r) * i * 0.35 * u;
        ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
  }
  ctx.restore();
}

function man(x, y, h, t, o = {}) {
  const u = h / 100, walk = o.walk || 0;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = C.ink; ctx.strokeStyle = C.ink; ctx.lineCap = 'round';
  // guitar neck over the shoulder
  ctx.lineWidth = 2.6 * u; ctx.beginPath(); ctx.moveTo(-9 * u, -46 * u); ctx.lineTo(13 * u, -108 * u); ctx.stroke();
  ctx.save(); ctx.translate(13 * u, -108 * u); ctx.rotate(0.34); ctx.fillRect(-2.2 * u, -8 * u, 4.4 * u, 8 * u); ctx.restore();
  ctx.beginPath(); ctx.ellipse(0, -89 * u, 6.6 * u, 7.6 * u, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(1 * u, -96 * u, 6.8 * u, 3.8 * u, -0.15, 0, TAU); ctx.fill();
  ctx.fillRect(-2.4 * u, -84 * u, 4.8 * u, 7 * u);
  ctx.beginPath();
  ctx.moveTo(-11 * u, -76 * u); ctx.quadraticCurveTo(0, -80 * u, 11 * u, -76 * u);
  ctx.lineTo(10 * u, -30 * u); ctx.lineTo(-10 * u, -30 * u); ctx.closePath(); ctx.fill();
  ctx.lineWidth = 4.8 * u;
  const a = Math.sin(walk) * 6 * u;
  ctx.beginPath(); ctx.moveTo(-4 * u, -34 * u); ctx.lineTo(-4 * u + a, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4 * u, -34 * u); ctx.lineTo(4 * u - a, 0); ctx.stroke();
  ctx.lineWidth = 3.6 * u;
  ctx.beginPath(); ctx.moveTo(-10 * u, -73 * u); ctx.lineTo(-13 * u - a * 0.5, -46 * u); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10 * u, -73 * u); ctx.lineTo(13 * u + a * 0.5, -46 * u); ctx.stroke();
  ctx.restore();
}

function duck(x, y, s, t, o = {}) {
  const u = s / 100;
  ctx.save(); ctx.translate(x, y);
  if (o.tilt) ctx.rotate(o.tilt);
  if (o.waterline) { ctx.beginPath(); ctx.rect(-200 * u, -300 * u, 400 * u, 300 * u + o.waterline * u); ctx.clip(); }
  ctx.fillStyle = C.ink;
  if (o.feet) {
    ctx.strokeStyle = C.amber; ctx.lineWidth = 3 * u; ctx.lineCap = 'round';
    const w = Math.sin(o.feet) * 8 * u;
    [[-6, w], [8, -w]].forEach(([fx, d]) => { ctx.beginPath(); ctx.moveTo(fx * u, 14 * u); ctx.lineTo(fx * u + d, 30 * u); ctx.lineTo(fx * u + d + 9 * u, 31 * u); ctx.stroke(); });
  }
  ctx.beginPath(); ctx.ellipse(0, 0, 46 * u, 24 * u, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-36 * u, -10 * u); ctx.lineTo(-64 * u, -30 * u); ctx.lineTo(-30 * u, 8 * u); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(18 * u, -14 * u); ctx.quadraticCurveTo(26 * u, -26 * u, 24 * u, -38 * u); ctx.lineTo(44 * u, -34 * u); ctx.quadraticCurveTo(40 * u, -16 * u, 44 * u, -4 * u); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = rgba(C.sepia, 0.8); ctx.lineWidth = 2.4 * u;
  ctx.beginPath(); ctx.moveTo(-30 * u, -6 * u); ctx.quadraticCurveTo(0, -18 * u, 24 * u, -2 * u); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-26 * u, 2 * u); ctx.quadraticCurveTo(-2 * u, -8 * u, 20 * u, 6 * u); ctx.stroke();
  // head (can flip for the "weird" double-take)
  ctx.save(); ctx.translate(34 * u, -42 * u); ctx.scale(o.flip ?? 1, 1);
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(0, 0, 15 * u, 0, TAU); ctx.fill();
  ctx.fillStyle = C.amber; ctx.beginPath(); ctx.moveTo(11 * u, -4 * u); ctx.quadraticCurveTo(26 * u, -6 * u, 33 * u, 2 * u); ctx.quadraticCurveTo(24 * u, 7 * u, 11 * u, 5 * u); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.bone; ctx.beginPath(); ctx.arc(4 * u, -4 * u, 2.6 * u, 0, TAU); ctx.fill();
  ctx.restore();
  if (o.hat !== undefined) {
    const hy = o.hat;
    ctx.save(); ctx.translate(32 * u, -54 * u + hy); ctx.rotate(-0.12);
    ctx.fillStyle = C.umber;
    ctx.beginPath(); ctx.ellipse(0, 0, 25 * u, 5 * u, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-12 * u, 0); ctx.quadraticCurveTo(-13 * u, -17 * u, -6 * u, -18 * u); ctx.quadraticCurveTo(0, -13 * u, 6 * u, -18 * u); ctx.quadraticCurveTo(13 * u, -17 * u, 12 * u, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.rust; ctx.fillRect(-12 * u, -5 * u, 24 * u, 3.4 * u);
    ctx.restore();
  }
  if (o.badge) {
    const k = o.badge, sc = lerp(2.2, 1, eBack(clamp(k)));

  for (let i = 0; i < 16; i++) { const y = hz + 10 + i * i * 1.6, w = 200 - i * 9 + Math.sin(t * 3 + i) * 20; ctx.fillRect(900 - w / 2 + Math.sin(t * 2 + i * 1.3) * 16, y, w, 3 + i * 0.3); }

}

function sceneWanted(t, lt) {

  }

  const px = 500, py = 450, pw = 620, ph = 820;
  ctx.save(); ctx.translate(px, py - ph / 2); ctx.rotate(sway - 0.02); ctx.translate(0, ph / 2);
  ctx.fillStyle = rgba(C.ink, 0.5); ctx.fillRect(-pw / 2 + 16, -ph / 2 + 18, pw, ph);
  ctx.fillStyle = C.paper;

  for (let y = -ph / 2; y <= ph / 2; y += 20) ctx.lineTo(pw / 2 - hash(y) * 6, y);

  ctx.closePath(); ctx.fill();
  const pg = ctx.createRadialGradient(0, 0, 100, 0, 0, 520); pg.addColorStop(0, rgba(C.bone, 0.3)); pg.addColorStop(1, rgba(C.sepia, 0.5)); ctx.fillStyle = pg; ctx.fill();
  ctx.fillStyle = C.ink; ctx.font = `118px ${DISPLAY}`; ctx.textAlign = 'center'; ctx.fillText('WANTED', 0, -ph / 2 + 190);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-pw / 2 + 40, -ph / 2 + 220); ctx.lineTo(pw / 2 - 40, -ph / 2 + 220); ctx.stroke();

  ctx.fillStyle = C.ink; ctx.fillRect(ix - 160, iy + 10, 320, 120); ctx.fillRect(ix + 150, iy + 30, 110, 16);
  ctx.fillStyle = '#6b5a33'; ctx.beginPath(); ctx.ellipse(ix, iy + 12, 160, 26, 0, 0, TAU); ctx.fill();
  for (let i = 0; i < 4; i++) {
    const hx = ix - 100 + i * 62, hy = iy + 10 + Math.sin(lt * 4 + i * 1.7) * 4, a = -0.4 + i * 0.3 + Math.sin(lt * 2 + i) * 0.1;
    ctx.save(); ctx.translate(hx, hy); ctx.rotate(a); ctx.fillStyle = '#b5623a'; ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-34, -8); ctx.lineTo(34, -8); ctx.arc(34, 0, 8, -Math.PI / 2, Math.PI / 2); ctx.lineTo(-34, 8); ctx.arc(-34, 0, 8, Math.PI / 2, Math.PI * 1.5); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  ctx.strokeStyle = rgba(C.bone, 0.6); ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(ix, iy + 12, 150, 20, 0, Math.PI * 1.1, Math.PI * 1.5); ctx.stroke();
  const fa = lt * 5, fx = ix + Math.cos(fa) * 140, fy = iy - 90 + Math.sin(fa * 2) * 30;
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(fx, fy, 5, 0, TAU); ctx.fill();
  ctx.fillStyle = rgba(C.ink, 0.35); ctx.beginPath(); ctx.ellipse(fx - 4, fy - 6, 6, 3, -0.6 + Math.sin(t * 60) * 0.5, 0, TAU); ctx.ellipse(fx + 4, fy - 6, 6, 3, 0.6 - Math.sin(t * 60) * 0.5, 0, TAU); ctx.fill();

  // NOT stamp over "WANTED"
  const nk = clamp((t - 28.36) / 0.15);
  if (nk > 0) {
    ctx.save(); ctx.translate(-170, -ph / 2 + 80); ctx.rotate(-0.22); const s = lerp(2.2, 1, eBack(nk)); ctx.scale(s, s); ctx.globalAlpha = clamp(nk * 2) * 0.92;
    ctx.strokeStyle = C.red; ctx.lineWidth = 6; ctx.strokeRect(-92, -48, 184, 80);
    ctx.fillStyle = C.red; ctx.font = `64px ${DISPLAY}`; ctx.textAlign = 'center'; ctx.fillText('NOT', 0, 18); ctx.restore();

    ctx.save(); ctx.translate(ix, iy); ctx.rotate(0.1); const s = lerp(2.6, 1, eBack(sk)); ctx.scale(s, s); ctx.globalAlpha = clamp(sk * 2) * 0.9;

function sceneOutro(t, lt) {
  const hz = 540, vx = W / 2;
  const g = sky([[0, '#140e0a'], [0.4, C.dusk], [0.75, C.ember], [1, C.amber]], 0, hz);
  rays(vx, hz, 30, t * 0.03, C.amber, 0.08);
  sun(vx, hz, 230, g);
  ridge(hz + 4, 80, 0.003, 31, C.umber, true);
  ctx.fillStyle = C.ink2; ctx.fillRect(-80, hz, W + 160, H);
  ctx.fillStyle = C.ink;
  ctx.beginPath(); ctx.moveTo(vx - 30, hz); ctx.lineTo(vx + 30, hz); ctx.lineTo(vx + 900, H + 80); ctx.lineTo(vx - 900, H + 80); ctx.fill();
  ctx.strokeStyle = C.umber; ctx.lineWidth = 1;
  for (let i = 1; i < 30; i++) { const d = Math.pow(i / 30, 2.2), y = hz + (H + 80 - hz) * d, hw = 30 + 870 * d * 0.62; ctx.lineWidth = 1 + d * 12; ctx.beginPath(); ctx.moveTo(vx - hw, y); ctx.lineTo(vx + hw, y); ctx.stroke(); }
  ctx.strokeStyle = C.sepia; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(vx - 8, hz); ctx.lineTo(vx - 360, H + 80); ctx.moveTo(vx + 8, hz); ctx.lineTo(vx + 360, H + 80); ctx.stroke();
  const k = clamp(lt / 2.6), depth = lerp(1, 0.5, eOut(k) * 0.8 + k * 0.2);
  const fy = hz + (H - 40 - hz) * depth, fs = 420 * depth, walk = lt * 7;
  man(vx - 70 * depth, fy - Math.abs(Math.sin(walk)) * 6 * depth, fs, t, { walk });
  woman(vx + 70 * depth, fy - Math.abs(Math.sin(walk + 1)) * 6 * depth, fs * 0.93, t, { wind: 0.6, walk: walk + 1 });
  const dd = lerp(1, 0.55, eOut(clamp((lt - 0.2) / 2.8)));
  duck(vx + 230 * dd, hz + (H - 40 - hz) * dd - 18 * dd, 150 * dd, t, { feet: walk * 1.4, tilt: Math.sin(walk * 1.4) * 0.12, hat: 0 });
  // iris out
  const ir = t < 32.2 ? 2000 : lerp(1100, 0, eOut(clamp((t - 32.2) / 1.0)));
  if (ir < 1990) {
    ctx.fillStyle = '#050403'; ctx.beginPath(); ctx.rect(-100, -100, W + 200, H + 200); ctx.arc(vx, fy - fs * 0.5, Math.max(0, ir), 0, TAU, true); ctx.fill('evenodd');
  }
  if (t > 33.1) {
    const a = smooth(33.1, 33.7, t), b = smooth(33.6, 34.3, t);
    ctx.fillStyle = '#050403'; ctx.fillRect(-100, -100, W + 200, H + 200);
    ctx.save(); ctx.globalAlpha = a; ctx.font = `150px ${WEST}`; ctx.textAlign = 'center'; ctx.fillStyle = C.rust; ctx.fillText('The End', W / 2 + 6, 440 + 7); ctx.fillStyle = C.bone; ctx.fillText('The End', W / 2, 440); ctx.restore();
    caption('WORDS BY A VERY DISCERNING YOUNG SONGWRITER', W / 2, 540, 28, rgba(C.bone, 0.9 * b), 'center');
    caption('★  NO DUCKS WERE HARMED  ★', W / 2, 590, 22, rgba(C.sepia, 0.9 * b), 'center');
  }
}

const SCENES = [
  { a: 0,     b: 5.95,  f: sceneDesert,   name: 'Ohhh' },
  { a: 5.95,  b: 9.75,  f: sceneHill,     name: 'Seen a woman' },
  { a: 9.75,  b: 12.3,  f: sceneMan,      name: 'I know I have' },
  { a: 12.3,  b: 16.2,  f: scenePrison,   name: 'Prison' },
  { a: 16.2,  b: 17.95, f: sceneTrain,    name: 'Freight train' },
  { a: 17.95, b: 20.62, f: sceneEye,      name: 'Bionic eyeballs' },
  { a: 20.62, b: 23.3,  f: sceneTriptych, name: 'Pasta & springs' },
  { a: 23.3,  b: 25.0,  f: sceneCurio,    name: 'Interesting things' },
  { a: 25.0,  b: 28.05, f: scenePond,     name: 'Ducks' },
  { a: 28.05, b: 31.4,  f: sceneWanted,   name: 'Hotdog water' },
  { a: 31.4,  b: 99,    f: sceneOutro,    name: 'The end' }
];
const SHAKES = [[15.30, 22], [20.70, 10], [21.82, 10], [27.32, 9], [28.36, 8], [30.70, 22], [10.72, 6]];
const sceneAt = t => SCENES.find(s => t >= s.a && t < s.b) || SCENES[SCENES.length - 1];

function render(t) {
  ctx.setTransform(sx, 0, 0, sx, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const sc = sceneAt(t), lt = t - sc.a, d = Math.min(sc.b, DUR) - sc.a;
  const f = Math.floor(t * 24);
  ctx.save();
  if (!reduce) {
    let shx = 0, shy = 0;
    SHAKES.forEach(([st, amp]) => { const k = t - st; if (k > 0 && k < 0.5) { const e = Math.exp(-k * 9) * amp; shx += Math.sin(k * 90) * e; shy += Math.cos(k * 77) * e; } });
    ctx.translate(shx + (hash(f) - 0.5) * 2.2, shy + (hash(f + 0.5) - 0.5) * 2.2);
  }
  const z = 1 + 0.035 * clamp(lt / d) + (reduce ? 0 : pulse(t, 10) * 0.006);
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  sc.f(t, lt);
  ctx.restore();
  // --- film treatment ---
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = 0.5;
  ctx.drawImage(grain[f % 4], (hash(f) - 0.5) * 40 - 20, (hash(f + 7) - 0.5) * 40 - 20, W + 40, H + 40);
  ctx.globalAlpha = 1;
  if (!vignette) { vignette = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05); vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(8,5,2,0.72)'); }
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  if (!reduce) { ctx.fillStyle = `rgba(10,6,3,${0.03 + hash(f * 1.3) * 0.07})`; ctx.fillRect(0, 0, W, H); }
  if (hash(f * 3.1) > 0.72) {
    const x = hash(f * 7.7) * W; ctx.strokeStyle = rgba(C.bone, 0.28); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.bezierCurveTo(x + 6, H * 0.3, x - 6, H * 0.6, x + 3, H); ctx.stroke();
  }
  for (let i = 0; i < 3; i++) { if (hash(f * 5 + i) > 0.6) { ctx.fillStyle = rgba(i % 2 ? '#000000' : C.bone, 0.45); ctx.beginPath(); ctx.ellipse(hash(f + i * 9) * W, hash(f + i * 13) * H, 1 + hash(f + i) * 4, 1 + hash(f + i * 2) * 3, hash(i + f), 0, TAU); ctx.fill(); } }
  // splice flash on each cut
  SCENES.forEach(s => { const k = t - s.a; if (s.a > 0 && k >= 0 && k < 0.07) { ctx.fillStyle = rgba(C.bone, 0.35 * (1 - k / 0.07)); ctx.fillRect(0, 0, W, H); ctx.fillStyle = rgba(C.ink, 0.6); ctx.fillRect(0, hash(s.a) * H, W, 6); } });
  ctx.restore();
}

// ---------- player ----------
const au = document.getElementById('au');
const big = document.getElementById('big'), pp = document.getElementById('pp'), scrub = document.getElementById('scrub');
const timeEl = document.getElementById('time'), chipsEl = document.getElementById('chips'), screen = document.getElementById('screen');
let started = false, base = 0, perf = 0, scrubbing = false;
const POSTER = 1.3;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
SCENES.forEach(s => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = s.name;
  b.addEventListener('click', () => { seek(s.a + 0.01); });
  chipsEl.appendChild(b); s.chip = b;
});
function clock() {
  if (!started) return POSTER;
  if (au.paused || scrubbing) return au.currentTime;
  const now = performance.now(), est = base + (now - perf) / 1000;
  if (Math.abs(est - au.currentTime) > 0.08) { base = au.currentTime; perf = now; return base; }
  return est;
}
function seek(t) { started = true; big.hidden = true; au.currentTime = clamp(t, 0, DUR); base = au.currentTime; perf = performance.now(); if (!au.paused) return; draw(); }
function play() { started = true; big.hidden = true; if (au.ended || au.currentTime >= DUR - 0.05) au.currentTime = 0; au.play().catch(() => {}); }
function toggle() { if (au.paused) play(); else au.pause(); }
big.addEventListener('click', play);
pp.addEventListener('click', toggle);
au.addEventListener('play', () => { pp.textContent = 'Pause'; base = au.currentTime; perf = performance.now(); });
au.addEventListener('pause', () => { pp.textContent = au.ended ? 'Replay' : 'Play'; });
au.addEventListener('ended', () => { pp.textContent = 'Replay'; });
scrub.addEventListener('input', () => { scrubbing = true; seek(parseFloat(scrub.value)); });
scrub.addEventListener('change', () => { scrubbing = false; });
document.getElementById('fs').addEventListener('click', () => { const el = screen; (el.requestFullscreen ? el.requestFullscreen() : Promise.reject()).catch(() => {}); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.code !== 'Space') return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.code === 'ArrowRight') seek(au.currentTime + 2);
  if (e.code === 'ArrowLeft') seek(au.currentTime - 2);
});
let lastScene = null;
function draw() {
  const t = clock();
  render(t);
  if (started) {
    if (!scrubbing) scrub.value = t.toFixed(2);
    timeEl.textContent = `${fmt(t)} / ${fmt(DUR)}`;
  }
  const sc = sceneAt(t);
  if (sc !== lastScene) { SCENES.forEach(s => s.chip.setAttribute('aria-current', s === sc && started ? 'true' : 'false')); lastScene = sc; }
}
function loop() { draw(); requestAnimationFrame(loop); }
new ResizeObserver(() => { resize(); draw(); }).observe(cv);
resize();
window.__renderAt = t => { render(t); };
Promise.all(['200px "Holtwood One SC"', '24px "Special Elite"', '150px "Rye"'].map(f => document.fonts.load(f).catch(() => {}))).then(() => draw());
requestAnimationFrame(loop);
})();
</script>
