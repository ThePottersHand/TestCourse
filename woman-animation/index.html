<title>Woman, a Ballad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Big+Shoulders+Stencil+Display:wght@800&family=IM+Fell+English:ital@0;1&family=Special+Elite&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #070707;
    --ink-2: #141414;
    --line: #2c2c2c;
    --silver: #efebe2;
    --muted: #a39f97;
    --red: #d8242c;
    --display: "Big Shoulders Display", Oswald, Impact, "Arial Narrow", sans-serif;
    --serif: "IM Fell English", Georgia, "Times New Roman", serif;
    --type: "Special Elite", "Courier New", monospace;
  }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--silver);
    font-family: var(--type);
    padding-inline: 16px;
    padding-block: 20px 28px;
    box-sizing: border-box;
  }
  .wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 14px; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .head h1 { font-family: var(--display); font-weight: 900; font-size: clamp(34px, 5vw, 52px); letter-spacing: 0.06em; margin: 0; line-height: 0.9; text-transform: uppercase; }
  .head h1 span { color: var(--red); }
  .head p { margin: 0; color: var(--muted); font-family: var(--serif); font-style: italic; font-size: 17px; }
  .screen { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background: #000; overflow: hidden; box-shadow: 0 40px 90px -40px #000, 0 0 0 1px var(--line); }
  .screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .big {
    position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%);
    font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: clamp(16px, 2.4vw, 26px); letter-spacing: 0.12em;
    color: var(--silver); background: var(--red); border: 0; padding: 0.55em 1.4em 0.5em; cursor: pointer;
    box-shadow: 0 10px 40px -8px rgba(216, 36, 44, 0.7);
  }
  .big:disabled { background: #2a2a2a; color: var(--muted); box-shadow: none; cursor: progress; }
  .big:not(:disabled):hover { background: #e8323a; }
  .big:focus-visible, .ctl:focus-visible, .chip:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--silver); outline-offset: 3px; }
  .controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .ctl { font-family: var(--type); font-size: 15px; color: var(--silver); background: var(--ink-2); border: 1px solid var(--line); padding: 8px 14px; cursor: pointer; min-width: 84px; }
  .ctl:hover { border-color: var(--muted); }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; min-width: 96px; }
  .scrub { flex: 1 1 260px; min-width: 0; }
  input[type=range] { width: 100%; accent-color: var(--red); margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-family: var(--type); font-size: 13px; color: var(--muted); background: transparent; border: 1px solid var(--line); padding: 4px 9px; cursor: pointer; }
  .chip:hover { color: var(--silver); }
  .chip[aria-current="true"] { color: var(--silver); background: var(--red); border-color: var(--red); }
  .note { color: var(--muted); font-size: 13px; margin: 0; }
</style>

<div class="wrap">
  <header class="head">
    <h1>Woman<span>.</span></h1>
    <p>A ballad in black &middot; words by a very discerning young songwriter</p>
  </header>

  <div class="screen" id="screen">
    <canvas id="c" aria-label="Animated film for the song Woman"></canvas>
    <button class="big" id="big" type="button">&#9654;&ensp;Play with sound</button>
  </div>

  <div class="controls">
    <button class="ctl" id="pp" type="button">Play</button>
    <span class="time" id="time">0:00 / 0:35</span>
    <div class="scrub"><input type="range" id="scrub" min="0" max="35" step="0.01" value="0" aria-label="Seek"></div>
    <button class="ctl" id="fs" type="button">Full screen</button>
  </div>
  <nav class="chips" id="chips" aria-label="Scenes"></nav>
  <p class="note">Space plays and pauses. Arrow keys skip two seconds. Pick a scene to jump straight to it.</p>
</div>

<audio id="au" src="woman.mp3" preload="auto"></audio>

<script src="js/core.js"></script>
<script src="js/tex.js"></script>
<script src="js/post.js"></script>
<script src="js/chars.js"></script>
<script src="js/world.js"></script>
<script src="js/sc1.js"></script>
<script src="js/sc2.js"></script>
<script src="js/sc3.js"></script>
<script src="js/sc4.js"></script>
<script src="js/main.js"></script>
