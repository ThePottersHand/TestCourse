<!doctype html>
<html><head><meta charset="utf-8"><title>Character sheet</title>
<style>html,body{margin:0;background:#e9e5dc}svg{display:block}</style></head>
<body>
<svg id="stage" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script type="module">
import { el, g, T } from './lib/core.js';
import { P } from './lib/palette.js';
import { narrator, SIT } from './chars/narrator.js';
import { puppy } from './chars/puppy.js';

const svg = document.getElementById('stage');
const defs = el('defs'); svg.appendChild(defs);
svg.appendChild(el('rect', { width: 1920, height: 1080, fill: '#ddd8cc' }));
svg.appendChild(el('path', { d: 'M0 900 H1920', stroke: '#b7b0a2', 'stroke-width': 2 }));

const n1 = narrator(defs); svg.appendChild(n1.root); n1.set({ x: 260, y: 900, scale: 1.1 });
const n2 = narrator(defs, { seed: 21 }); svg.appendChild(n2.root);
n2.set({ x: 640, y: 900, scale: 1.1, flip: -1, glasses: true, brow: 4, armN: [-6, -8, 0, 1], armF: [4, -6, 0, 1], lean: 3 });
const n3 = narrator(defs, { seed: 31 }); svg.appendChild(n3.root);
n3.set({ ...SIT, x: 380, y: 1060, scale: 0.8, shoeless: true, flip: -1, buttons: 2, tuft: true });

const pups = [
  ['side', 'sit', 1, {}], ['side', 'stand', 2, { wag: 20 }], ['side', 'beg', 3, {}], ['side', 'sit', 4, { headRot: -35, bark: true }],
  ['front', 'sit', 5, {}], ['front', 'sit', 6, { headRot: 12, shine: true }], ['front', 'sit', 7, { bark: true }],
];
pups.forEach(([view, pose, seed, q], i) => {
  const p = puppy(defs, { view, pose, seed, harold: i === 3 });
  svg.appendChild(p.root);
  p.set({ x: 900 + (i % 4) * 250, y: i < 4 ? 520 : 900, scale: 1.8, ...q });
});
window.__ready = true;
</script>
</body></html>
