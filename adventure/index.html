<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starfall Expedition</title>
<meta name="description" content="A walking choose-your-own-adventure with GPS, an AR scanner, puzzles and a team score.">
<meta name="theme-color" content="#0d0f2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bungee&family=Chakra+Petch:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Layout: a one-screen field device. Fixed HUD on top, one scrolling story panel, a thumb-height action bar at the bottom. */
:root {
  --bg: #eef0fa;
  --surface: #ffffff;
  --surface-2: #f6f7fd;
  --ink: #181a3f;
  --muted: #565b85;
  --line: #d6d9ee;
  --signal: #ff6a2b;
  --on-signal: #181a3f;
  --shard: #0a9fb2;
  --zib: #17b3a1;
  --gloop: #8b46d6;
  --glow: #a87300;
  --slime: #3b8a1d;
  --comet: #d9480f;
  --moon: #5f4fd6;
  --good: #1d8f4e;
  --bad: #cf3434;
  --warn: #b77900;
  --shadow: 0 1px 2px rgba(24, 26, 63, .08), 0 8px 24px rgba(24, 26, 63, .08);

  --font-display: 'Bungee', 'Arial Black', Impact, system-ui, sans-serif;
  --font-body: 'Atkinson Hyperlegible', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-hud: 'Chakra Petch', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

  --step--1: .875rem;
  --step-0: 1.0625rem;
  --step-1: 1.25rem;
  --step-2: 1.6rem;
  --step-3: 2.2rem;
  --step-4: 3.4rem;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f2b; --surface: #171a40; --surface-2: #1f2350; --ink: #f1f2ff; --muted: #a9add8; --line: #2d3168;
    --signal: #ff7a3d; --on-signal: #14163a; --shard: #39d3e6; --zib: #3fe0c9; --gloop: #b57cff;
    --glow: #ffc93a; --slime: #78d64f; --comet: #ff8a4d; --moon: #a597ff;
    --good: #4cd38a; --bad: #ff6b6b; --warn: #ffc24a; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f2b; --surface: #171a40; --surface-2: #1f2350; --ink: #f1f2ff; --muted: #a9add8; --line: #2d3168;
  --signal: #ff7a3d; --on-signal: #14163a; --shard: #39d3e6; --zib: #3fe0c9; --gloop: #b57cff;
  --glow: #ffc93a; --slime: #78d64f; --comet: #ff8a4d; --moon: #a597ff;
  --good: #4cd38a; --bad: #ff6b6b; --warn: #ffc24a; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: var(--step-0); line-height: 1.5;
  -webkit-tap-highlight-color: transparent; overflow: hidden;
}
[hidden] { display: none !important; }
img { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--shard); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

#app {
  height: 100%; display: grid; grid-template-rows: auto 1fr auto;
  padding-top: env(safe-area-inset-top, 0px);
}

/* HUD */
#hud {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.hud-score { display: flex; flex-direction: column; line-height: 1; min-width: 4.5rem; position: relative; }
.hud-score small { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.hud-score b { font-family: var(--font-hud); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.pop { position: absolute; left: 100%; top: 0; font-family: var(--font-hud); font-weight: 700; color: var(--good);
  animation: pop 1.4s ease-out forwards; white-space: nowrap; pointer-events: none; }
@keyframes pop { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-24px); } }
.tray { display: flex; gap: 5px; margin-inline: auto; }
.tray span {
  width: 30px; height: 34px; display: grid; place-items: center; font-family: var(--font-display); font-size: .95rem;
  clip-path: polygon(50% 0, 100% 28%, 100% 72%, 50% 100%, 0 72%, 0 28%);
  background: var(--line); color: transparent;
}
.tray span.got { background: var(--shard); color: var(--on-signal); }
.icon-btn {
  min-width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2);
  display: inline-grid; place-items: center; padding: 0 10px; cursor: pointer; font-weight: 700; font-size: .85rem;
}
.icon-btn svg { width: 22px; height: 22px; }

/* Main panel */
#main { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 28px; display: flex; flex-direction: column; gap: 18px; }
.eyebrow { font-family: var(--font-hud); font-weight: 700; font-size: .78rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.title { font-family: var(--font-display); font-weight: 400; font-size: var(--step-3); line-height: 1.05; letter-spacing: .01em; }
.title.sm { font-size: var(--step-2); }
.lede { color: var(--muted); max-width: 60ch; margin: 0; }
p { margin: 0; }

/* Footer action bar */
#bar {
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line);
  display: flex; gap: 10px; flex-wrap: wrap;
}
#bar:empty { display: none; }
.btn {
  flex: 1 1 auto; min-height: 56px; border-radius: var(--radius); border: 2px solid transparent; padding: 10px 18px;
  font-weight: 700; font-size: 1.1rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  text-align: center; text-decoration: none; transition: transform .08s ease;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--signal); color: var(--on-signal); }
.btn.secondary { background: var(--surface-2); border-color: var(--line); color: var(--ink); }
.btn.ghost { background: transparent; color: var(--muted); border-color: transparent; text-decoration: underline; text-underline-offset: 3px; min-height: 44px; font-size: 1rem; }
.btn.small { min-height: 44px; font-size: .95rem; padding: 8px 14px; flex: 0 0 auto; }
.btn.warn { background: transparent; border-color: var(--warn); color: var(--warn); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.confirming { background: var(--bad); color: #fff; border-color: var(--bad); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* Transmission lines */
.log { display: flex; flex-direction: column; gap: 14px; }
.line { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; animation: rise .35s ease-out both; }
.line .who { width: 44px; height: 44px; }
.line .bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 4px 16px 16px 16px; padding: 10px 14px; min-width: 0; box-shadow: var(--shadow); }
.line .bubble .name { display: block; font-family: var(--font-hud); font-weight: 700; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 2px; }
.line.z .name { color: var(--zib); }
.line.g .bubble { border-color: color-mix(in srgb, var(--gloop) 45%, var(--line)); }
.line.g .name { color: var(--gloop); }
.line.n { display: block; padding-inline: 6px; font-style: italic; color: var(--muted); }
.line.sys { display: block; font-family: var(--font-hud); font-weight: 700; font-size: .85rem; letter-spacing: .1em; text-transform: uppercase; color: var(--shard); }
.line.sys::before { content: '>> '; }
@keyframes rise { from { opacity: .001; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.flat { box-shadow: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-family: var(--font-hud); font-weight: 700; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; border: 1.5px solid currentColor; white-space: nowrap; }
.chip.good { color: var(--good); } .chip.bad { color: var(--bad); } .chip.warn { color: var(--warn); } .chip.muted { color: var(--muted); }
.chip.glow { color: var(--glow); } .chip.slime { color: var(--slime); } .chip.comet { color: var(--comet); } .chip.moon { color: var(--moon); } .chip.main { color: var(--muted); }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }

/* Title screen */
.hero { position: relative; min-height: 46vh; display: grid; align-content: end; padding: 28px 16px 8px; overflow: hidden; color: #f1f2ff; background: #0d0f2b; }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero .inner { position: relative; max-width: 640px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 10px; }
.hero .logo { font-family: var(--font-display); font-size: clamp(2.4rem, 11vw, 4.2rem); line-height: .95; letter-spacing: .01em; }
.hero .logo span { display: block; color: #39d3e6; }
.hero p { color: #c6c9f0; max-width: 40ch; }

/* Rules */
.rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; counter-reset: r; }
.rules li { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; counter-increment: r; }
.rules li::before { content: counter(r); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--signal); color: var(--on-signal); font-family: var(--font-display); }
.rules b { display: block; }
.rules span { color: var(--muted); }
.check { display: flex; gap: 12px; align-items: center; padding: 12px; border: 2px dashed var(--line); border-radius: var(--radius); cursor: pointer; }
.check input { width: 28px; height: 28px; accent-color: var(--signal); flex: 0 0 auto; }

/* Permissions */
.perm { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; }
.perm .label b { display: block; }
.perm .label span { color: var(--muted); font-size: var(--step--1); }

/* Travel */
.dial-wrap { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.dial { width: 140px; height: 140px; position: relative; }
.dial svg { width: 100%; height: 100%; display: block; }
.dial .arrow { transition: transform .25s linear; transform-origin: 70px 70px; }
.readout b { display: block; font-family: var(--font-hud); font-weight: 700; font-size: var(--step-4); line-height: 1; font-variant-numeric: tabular-nums; }
.readout .sub { color: var(--muted); }
.bars { display: flex; gap: 4px; align-items: end; height: 26px; margin-top: 8px; }
.bars i { width: 10px; background: var(--line); border-radius: 2px; }
.bars i.on { background: var(--shard); }
.trend { font-family: var(--font-display); font-size: var(--step-1); }
.trend.warm { color: var(--comet); } .trend.cold { color: var(--shard); }
.eyesup { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--radius); background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border: 1.5px solid color-mix(in srgb, var(--warn) 50%, transparent); font-weight: 700; }
.eyesup svg { width: 30px; height: 30px; flex: 0 0 auto; color: var(--warn); }
.hint-card { border-left: 0; }
.hint-card .q { font-size: var(--step-1); font-weight: 700; }
.minimap { height: 260px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }

/* Challenges */
.qhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.question { font-size: var(--step-1); font-weight: 700; line-height: 1.35; }
.visual { font-family: var(--font-display); font-size: var(--step-3); letter-spacing: .3em; text-align: center; padding: 14px 8px; border-radius: var(--radius); background: var(--surface-2); border: 2px dashed var(--line); overflow-wrap: anywhere; }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .options { grid-template-columns: 1fr; } }
.opt { min-height: 60px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); font-weight: 700; font-size: 1.1rem; padding: 10px 14px; cursor: pointer; text-align: left; }
.opt.wrong { border-color: var(--bad); color: var(--bad); text-decoration: line-through; opacity: .7; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); color: var(--good); }
.answer-row { display: flex; gap: 10px; }
.answer-row input { flex: 1 1 auto; min-width: 0; }
.field { width: 100%; min-height: 54px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); padding: 10px 14px; font-size: 1.15rem; }
.field:focus { border-color: var(--shard); outline: none; }
textarea.field { min-height: 90px; font-family: var(--font-hud); font-size: .9rem; }
.tries { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: var(--step--1); }
.tries i { width: 12px; height: 12px; border-radius: 50%; background: var(--shard); }
.tries i.used { background: var(--line); }
.feedback { padding: 14px; border-radius: var(--radius); font-weight: 700; display: flex; flex-direction: column; gap: 6px; }
.feedback.good { background: color-mix(in srgb, var(--good) 14%, var(--surface)); color: var(--good); }
.feedback.bad { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); color: var(--bad); }
.feedback .more { color: var(--ink); font-weight: 400; }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

.ticks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tick { min-height: 56px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; padding: 8px 12px; text-align: left; display: flex; align-items: center; gap: 10px; }
.tick::before { content: ''; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--muted); flex: 0 0 auto; }
.tick.on { border-color: var(--good); }
.tick.on::before { background: var(--good); border-color: var(--good); box-shadow: inset 0 0 0 3px var(--surface); }
.timer { width: 180px; height: 180px; margin: 0 auto; position: relative; }
.timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-hud); font-size: 3rem; font-variant-numeric: tabular-nums; }
.photo-prev { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); max-height: 280px; display: grid; place-items: center; background: var(--surface-2); }
.photo-prev img { display: block; max-height: 280px; object-fit: contain; }

/* Choice */
.paths { display: grid; gap: 12px; }
.path { text-align: left; border-radius: var(--radius); padding: 16px; background: var(--surface); border: 2px solid var(--pc, var(--line)); cursor: pointer; display: grid; grid-template-columns: 54px 1fr; gap: 14px; align-items: center; box-shadow: var(--shadow); }
.path .glyph { width: 54px; height: 54px; border-radius: 50%; background: var(--pc); display: grid; place-items: center; color: var(--on-signal); }
.path .glyph svg { width: 30px; height: 30px; }
.path b { font-family: var(--font-display); font-weight: 400; font-size: var(--step-1); display: block; color: var(--pc); line-height: 1.15; }
.path span { color: var(--muted); }

/* Launch code tiles */
.tiles { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.tile { width: 56px; height: 64px; display: grid; place-items: center; font-family: var(--font-display); font-size: 1.8rem; border: 0; cursor: pointer;
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--shard); color: var(--on-signal); }
.tile.used { opacity: .25; }
.slots { display: flex; gap: 8px; justify-content: center; }
.slots span { width: 48px; height: 58px; border-bottom: 4px solid var(--line); display: grid; place-items: center; font-family: var(--font-display); font-size: 1.8rem; }

/* Results */
.rank { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.rank .big { font-family: var(--font-hud); font-weight: 700; font-size: var(--step-4); line-height: 1; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.stat small { display: block; color: var(--muted); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; }
.stat b { font-family: var(--font-hud); font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.badges { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.badge { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; border: 1.5px solid var(--line); }
.badge .medal { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--bc, var(--signal)); color: var(--on-signal); font-family: var(--font-display); }
.badge b { display: block; line-height: 1.2; }
.badge span { color: var(--muted); font-size: var(--step--1); }
.album { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.album figure { margin: 0; }
.album img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; display: block; }
.album figcaption { font-size: .8rem; color: var(--muted); }
.breakdown { width: 100%; border-collapse: collapse; font-size: var(--step--1); }
.breakdown td { padding: 6px 0; border-bottom: 1px solid var(--line); }
.breakdown td:last-child { text-align: right; font-family: var(--font-hud); font-variant-numeric: tabular-nums; }
.cert img { border-radius: 12px; border: 1px solid var(--line); display: block; }

/* Setup */
.setup-map { height: 340px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); position: relative; }
.map-note { position: absolute; inset: auto 8px 8px 8px; z-index: 500; }
.placing { background: var(--signal); color: var(--on-signal); padding: 8px 12px; border-radius: 10px; font-weight: 700; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.pin { display: flex; flex-direction: column; gap: 10px; }
.pin-head { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; }
.pin-num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-hud); font-weight: 700; color: var(--on-signal); background: var(--pc, var(--muted)); }
.pin-head b { display: block; line-height: 1.2; }
.pin-head small { color: var(--muted); }
.pin label, .lbl { font-size: var(--step--1); font-weight: 700; color: var(--muted); display: block; margin-bottom: 4px; }
.pin .field { min-height: 46px; font-size: 1rem; }
details summary { cursor: pointer; font-weight: 700; color: var(--muted); padding: 4px 0; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 2px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.seg button { min-height: 52px; border: 0; background: var(--surface); font-weight: 700; cursor: pointer; padding: 8px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.routes { width: 100%; border-collapse: collapse; }
.routes td { padding: 8px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
.routes td:nth-child(2) { text-align: right; font-family: var(--font-hud); font-weight: 700; white-space: nowrap; padding-inline: 10px; }
.routes td:last-child { text-align: right; }
.bullets { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.kid { display: grid; grid-template-columns: 1fr 88px; gap: 10px; align-items: end; }
.kid .levels { grid-column: 1 / -1; }
.kid .btn.ghost { grid-column: 1 / -1; justify-self: end; }
.levels { display: grid; grid-template-columns: repeat(3, 1fr); border: 2px solid var(--line); border-radius: 12px; overflow: hidden; }
.levels button { min-height: 44px; border: 0; background: var(--surface); font-weight: 700; cursor: pointer; }
.levels button[aria-pressed="true"] { background: var(--shard); color: var(--on-signal); }
.marker-pin { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--font-hud); color: #14163a; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
.marker-me { width: 18px; height: 18px; border-radius: 50%; background: #2a7fff; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(42,127,255,.25); }

/* Commander sheet */
#sheet { position: fixed; inset: 0; z-index: 2000; background: rgba(8, 9, 30, .55); display: flex; align-items: flex-end; justify-content: center; }
#sheet .panel { background: var(--surface); width: 100%; max-width: 640px; border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; max-height: 88%; overflow-y: auto; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; }
.toggle input { width: 26px; height: 26px; accent-color: var(--signal); }

/* AR scanner: always dark, it sits on a camera feed */
#scanner { position: fixed; inset: 0; z-index: 3000; background: #050616; color: #f1f2ff; touch-action: none; user-select: none; -webkit-user-select: none; }
#scanner video, #scanner canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#scanner video { object-fit: cover; }
#scanner .scan-top { position: absolute; left: 0; right: 0; top: 0; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; display: flex; gap: 10px; align-items: flex-start; background: linear-gradient(rgba(5,6,22,.75), rgba(5,6,22,0)); }
#scanner .scan-msg { flex: 1; font-weight: 700; font-size: 1.1rem; text-shadow: 0 1px 3px #000; }
#scanner .scan-msg small { display: block; font-family: var(--font-hud); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: #39d3e6; }
#scanner .scan-close { width: 46px; height: 46px; border-radius: 50%; border: 0; background: rgba(255,255,255,.18); color: #fff; font-size: 1.4rem; cursor: pointer; flex: 0 0 auto; }
#scanner .scan-bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; }
#scanner .scan-bottom .btn { flex: 0 1 auto; background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.3); }
#scanner .stopwalk { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(207, 52, 52, .82); font-family: var(--font-display); font-size: 2rem; text-align: center; padding: 24px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div id="app">
  <header id="hud" hidden>
    <div class="hud-score" aria-live="polite"><small>Score</small><b id="hudScore">0</b></div>
    <div class="tray" id="hudTray" aria-label="Star shards collected"></div>
    <button class="icon-btn" id="hudMenu" type="button" aria-label="Commander menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer id="bar"></footer>
</div>

<div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="panel" id="sheetPanel"></div></div>

<div id="scanner" hidden>
  <video id="scanVideo" playsinline muted autoplay></video>
  <canvas id="scanCanvas"></canvas>
  <div class="scan-top">
    <button class="scan-close" id="scanClose" type="button" aria-label="Close scanner">&times;</button>
    <div class="scan-msg" id="scanMsg"></div>
  </div>
  <div class="scan-bottom" id="scanBottom"></div>
  <div class="stopwalk" id="scanStop" hidden>Stop walking to scan!</div>
</div>

<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>

<script src="story.js"></script>
<script src="app.js"></script>
</body>
</html>
