<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turn the Eighties Up</title>
<style>
  :root {
    --ink: #0b0221;
    --glass: rgba(11, 2, 33, 0.72);
    --pink: #ff2a6d;
    --cyan: #05d9e8;
    --paper: #f2ecff;
    --dim: #a99bd6;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: #000; color: var(--paper); overflow: hidden; }
  body { font-family: "VT323", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }
  #gl { display: block; background: #000; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; }
  .hidden { opacity: 0; pointer-events: none; }

  /* start screen */
  #start {
    position: fixed; inset: 0; display: grid; place-items: center; transition: opacity .5s;
    background: radial-gradient(ellipse at 50% 60%, rgba(59, 10, 94, .55), rgba(0, 0, 0, .85) 70%);
  }
  #start .card { text-align: center; padding: 24px 16px; max-width: 92vw; }
  #start h1 {
    margin: 0 0 6px; font-family: "Monoton", "VT323", sans-serif; font-weight: 400; letter-spacing: .04em;
    font-size: clamp(30px, 7vw, 86px); line-height: 1.05; color: #fff; text-wrap: balance;
    text-shadow: 0 0 6px var(--pink), 0 0 22px var(--pink), 0 0 60px rgba(255, 42, 109, .6);
  }
  #start .sub { font-size: clamp(18px, 2.6vw, 28px); color: var(--cyan); letter-spacing: .12em; text-transform: uppercase; }
  #play {
    margin-top: 28px; font: inherit; font-size: clamp(24px, 3.4vw, 40px); letter-spacing: .15em; color: #fff; cursor: pointer;
    background: transparent; border: 2px solid var(--pink); border-radius: 4px; padding: 10px 34px;
    box-shadow: 0 0 12px rgba(255, 42, 109, .8), inset 0 0 12px rgba(255, 42, 109, .5); text-shadow: 0 0 8px var(--pink);
  }
  #play:hover, #play:focus-visible { background: rgba(255, 42, 109, .18); outline: none; box-shadow: 0 0 24px rgba(255, 42, 109, 1), inset 0 0 16px rgba(255, 42, 109, .7); }
  #play:disabled { opacity: .45; cursor: default; }
  #status { margin-top: 14px; min-height: 1.4em; color: var(--dim); font-size: 20px; }
  #hint { margin-top: 18px; color: var(--dim); font-size: 18px; letter-spacing: .06em; }
  #hint kbd { color: var(--paper); border: 1px solid #5b4a8a; border-radius: 3px; padding: 0 6px; font: inherit; }

  /* control bar */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 14px; background: linear-gradient(transparent, rgba(0, 0, 0, .85));
    transition: opacity .35s; font-size: 22px;
  }
  #bar button {
    font: inherit; color: #fff; background: none; border: 1px solid transparent; border-radius: 4px; cursor: pointer; padding: 2px 10px; min-width: 44px;
  }
  #bar button:hover, #bar button:focus-visible { border-color: var(--cyan); outline: none; color: var(--cyan); }
  #time { font-variant-numeric: tabular-nums; min-width: 9.5ch; text-align: center; color: var(--paper); }
  #track { position: relative; flex: 1; height: 26px; cursor: pointer; touch-action: none; }
  #track .rail { position: absolute; left: 0; right: 0; top: 11px; height: 4px; background: rgba(255, 255, 255, .18); border-radius: 2px; }
  #track .fill { position: absolute; left: 0; top: 11px; height: 4px; background: var(--pink); box-shadow: 0 0 8px var(--pink); border-radius: 2px; }
  #track .tick { position: absolute; top: 6px; width: 1px; height: 14px; background: rgba(5, 217, 232, .55); }
  #track .tick span { position: absolute; bottom: 16px; left: 3px; font-size: 15px; color: var(--dim); white-space: nowrap; pointer-events: none; }
  #track:focus-visible { outline: 1px dashed var(--cyan); outline-offset: 4px; }
  #sec { color: var(--cyan); min-width: 10ch; text-transform: uppercase; letter-spacing: .08em; }
  @media (max-width: 640px) { #sec, #track .tick span { display: none; } #bar { gap: 8px; font-size: 19px; } }

  #debug { position: fixed; top: 8px; left: 10px; font-size: 18px; color: #7dff3a; text-shadow: 0 0 4px #000; pointer-events: none; white-space: pre; }
  #err { position: fixed; inset: auto 16px 90px 16px; color: #ffb3c6; font-size: 20px; text-align: center; }
</style>
</head>
<body>
<div id="stage"><canvas id="gl" width="1280" height="720" aria-label="Music video for Turn the Eighties Up"></canvas></div>

<div id="start">
  <div class="card">
    <h1>Turn the<br>Eighties Up</h1>
    <div class="sub">a music video · rendered live in WebGL</div>
    <button id="play" disabled>▶ PLAY</button>
    <div id="status">Loading tape…</div>
    <div id="hint"><kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> seek 5s · <kbd>F</kbd> fullscreen · <kbd>H</kbd> hide controls</div>
  </div>
</div>

<div id="bar" class="hidden">
  <button id="pp" aria-label="Play or pause">▶</button>
  <span id="time">0:00 / 3:46</span>
  <div id="track" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="226" aria-valuenow="0">
    <div class="rail"></div><div class="fill"></div>
  </div>
  <span id="sec">intro</span>
  <button id="fs" aria-label="Fullscreen">⛶</button>
</div>
<div id="debug" hidden></div>
<div id="err" hidden></div>

<script src="js/fonts-data.js"></script>
<script src="js/track-data.js"></script>
<script src="js/core.js"></script>
<script src="js/track.js"></script>
<script src="js/render.js"></script>
<script src="js/strokes.js"></script>
<script src="js/text.js"></script>
<script src="js/shapes.js"></script>
<script src="js/backgrounds.js"></script>
<script src="js/fx.js"></script>
<script src="js/director.js"></script>
<script src="js/shots.js"></script>
<script src="js/main.js"></script>
</body>
</html>
