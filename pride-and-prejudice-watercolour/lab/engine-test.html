<!doctype html>
<html><head><meta charset="utf-8"><title>Engine test</title>
<style>body{margin:0;background:#222}canvas{display:block;width:100vw}
@font-face{font-family:'Pinyon';src:url('../fonts/PinyonScript-Regular.ttf')}</style></head>
<body><canvas id="c"></canvas>
<script src="../js/geom.js"></script>
<script src="../js/sdf.js"></script>
<script src="../js/engine.js"></script>
<script>
(async function () {
  await document.fonts.load('80px Pinyon');
  const eng = new WC.Engine(document.getElementById('c'), { width: 1920, height: 1080, scale: 1 });
  const t0 = performance.now();
  const circ = eng.mask(g => { g.beginPath(); g.arc(0, 0, 150, 0, 7); g.fill(); }, { x: -150, y: -150, w: 300, h: 300 });
  const rect = eng.mask(g => { g.fillRect(0, 0, 500, 260); }, { x: 0, y: 0, w: 500, h: 260 });
  const word = eng.mask(g => { g.font = '150px Pinyon'; g.fillText('like', 0, 120); }, { x: 0, y: 0, w: 300, h: 160 });
  console.log('masks', (performance.now() - t0).toFixed(0), 'ms');
  eng.begin();
  // wet-on-dry, hard edges, strong edge darkening
  eng.wash(circ, { xf: [1, 0, 0, 1, 260, 260], pig: '#e0607e', density: 0.9, edge: 1.4, edgeW: 5, seed: 1 });
  // overlapping indigo glaze
  eng.wash(circ, { xf: [1, 0, 0, 1, 420, 300], pig: '#3c4f7a', density: 0.9, edge: 1.2, seed: 2, gran: 0.9 });
  // wet-in-wet soft
  eng.wash(circ, { xf: [1.2, 0, 0, 1.2, 800, 280], pig: '#e0607e', pigB: '#3c4f7a', mix: { dir: [1, 0.3], at: 800, width: 120, noise: 0.8 }, soft: 22, edge: 0.3, density: 1, seed: 3 });
  // variegated rectangle, rough dry edge
  eng.wash(rect, { xf: [1, 0, 0, 1, 1100, 120], pig: '#d9a441', pigB: '#3f8f8a', mix: { dir: [1, 0], at: 250, width: 200, noise: 0.6 }, dry: 0.7, rough: 3, warp: 10, edge: 1, seed: 4 });
  // hollow wash (pale centre) + bloom rim
  eng.wash(circ, { xf: [1, 0, 0, 1, 300, 750], pig: '#3f8f8a', density: 1.2, hollow: 0.7, hollowW: 70, edge: 1.2, seed: 5 });
  eng.wash(circ, { xf: [0.5, 0, 0, 0.5, 330, 720], pig: '#3f8f8a', rim: 1, edge: 2.5, edgeW: 3, warp: 14, warpScale: 40, rough: 4, seed: 6, mode: 'normal' });
  eng.wash(circ, { xf: [0.5, 0, 0, 0.5, 330, 720], mode: 'lift', lift: 0.7, warp: 14, warpScale: 40, rough: 4, seed: 6 });
  // wash revealed by a wipe
  eng.wash(rect, { xf: [1, 0, 0, 1, 700, 620], pig: '#8a5a3c', density: 1, reveal: { dir: [1, 0.2], at: 330, soft: 40, noise: 30 }, seed: 7 });
  // painted word
  eng.wash(word, { xf: [1, 0, 0, 1, 1300, 600], pig: '#c23b5a', density: 1.1, edge: 1.5, edgeW: 2.5, warp: 1.5, warpScale: 60, rough: 0.6, seed: 8, soft: 0.8 });
  // ink + pencil
  let g = eng.layer();
  g.strokeStyle = '#000'; g.lineWidth = 1.2; g.lineCap = 'round';
  for (let i = 0; i < 4; i++) { g.beginPath(); g.moveTo(1100 + i * 3, 450 + i * 2); g.bezierCurveTo(1300, 380 + i * 4, 1500, 520, 1800, 430 - i * 3); g.stroke(); }
  eng.ink(eng._layerCanvas, { mode: 'pencil', color: '#5a5a60', strength: 0.9 });
  g = eng.layer();
  g.font = '64px Pinyon'; g.fillStyle = '#000'; g.fillText('Or maybe I hate him…', 1150, 900);
  eng.ink(eng._layerCanvas, { mode: 'ink', color: '#2b1d16', strength: 1.6, bleed: 1.0 });
  eng.end();
  console.log('total', (performance.now() - t0).toFixed(0), 'ms');
  window.__done = true;
})().catch(e => { console.log('ERR', e.message); window.__done = true; });
</script></body></html>
