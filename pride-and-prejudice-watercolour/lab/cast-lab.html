<!doctype html>
<html><head><meta charset="utf-8"><title>Cast lab</title>
<style>body{margin:0;background:#222}canvas{display:block;width:100vw}</style></head>
<body><canvas id="c"></canvas>
<script src="../js/geom.js"></script>
<script src="../js/sdf.js"></script>
<script src="../js/flood.js"></script>
<script src="../js/engine.js"></script>
<script src="../js/figures.js"></script>
<script src="../js/people.js"></script>
<script src="../js/timing.js"></script>
<script src="../js/anim.js"></script>
<script src="../js/kit.js"></script>
<script src="../js/cast.js"></script>
<script>
// Silhouette check sheet: cast-lab.html?mode=figures | busts  (&t= for the wind phase)
(async function () {
  const q = new URLSearchParams(location.search);
  const mode = q.get('mode') || 'figures', t = +(q.get('t') || 1.3);
  const eng = new WC.Engine(document.getElementById('c'), { scale: 1, paperSeed: 3 });
  const B = new WC.K.Builder(eng), C = WC.cast, P = WC.people;
  if (mode === 'figures') {
    C.lizzy(B, 'L0', { x: 230, y: 1000, s: 100, dir: 1, pose: P.lizzy.poses.stand(0) });
    C.lizzy(B, 'L1', { x: 640, y: 1000, s: 100, dir: 1, pose: P.lizzy.poses.stand(0), bonnet: true, streamers: 1.2 });
    C.lizzy(B, 'L2', { x: 1040, y: 1000, s: 100, dir: -1, pose: P.lizzy.poses.walk(0, 1.2), bonnet: true, streamers: 1.4 });
    C.darcy(B, 'D0', { x: 1480, y: 1000, s: 108, dir: -1, pose: P.darcy.poses.still() });
  } else {
    C.bust(B, 'b0', { kind: 'lizzy', x: 230, y: 120, s: 300, dir: 1 });
    C.bust(B, 'b1', { kind: 'darcy', x: 1000, y: 120, s: 300, dir: -1 });
    ['jane', 'mary', 'kitty', 'lydia'].forEach((k, i) => C.bust(B, 's' + i, { kind: k, x: 1200 + (i % 2) * 330, y: 90 + Math.floor(i / 2) * 470, s: 160, dir: 1 }));
  }
  const t0 = performance.now();
  B.jobs.forEach((j) => j());
  console.log('masks', B.jobs.length, 'ms', (performance.now() - t0).toFixed(0));
  const Mk = B.M, cam = [1, 0, 0, 1, 0, 0];
  eng.setTime(t); eng.begin(0);
  const bg = eng.maskAuto((g) => g.fillRect(20, 20, 1880, 1040), { maskScale: 0.3, margin: 60 });
  eng.wash(bg, { pig: '#f2dfb4', pigB: '#c9d3e6', mix: { dir: [1, 0], at: 960, width: 500, noise: 0.9 }, density: 0.5, soft: 4, warp: 20, warpScale: 240, flow: 0.5, seed: 1 });
  if (mode === 'figures') {
    C.paint(eng, Mk, 'L0', { cam, t, sway: 4 });
    C.paint(eng, Mk, 'L1', { cam, t, sway: 8, wind: -0.6 });
    C.paint(eng, Mk, 'L2', { cam, t, sway: 10, wind: 0.8, p: 0.7, wet: 1 });
    C.paint(eng, Mk, 'D0', { cam, t, sway: 6, wind: 0.5 });
  } else {
    ['b0', 'b1', 's0', 's1', 's2', 's3'].forEach((n) => C.paintBust(eng, Mk, n, { cam, t }));
  }
  eng.present({});
  eng.gl.finish();
  window.__done = true;
})().catch((e) => { console.log('ERR', e.stack || e.message); window.__done = true; });
</script></body></html>
