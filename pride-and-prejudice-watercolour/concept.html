<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept Still</title>
<style>
  @font-face { font-family: 'Pinyon'; src: url('fonts/PinyonScript-Regular.ttf'); }
  html, body { margin: 0; background: #1d1a17; }
  canvas { display: block; width: 100vw; height: auto; }
</style></head>
<body><canvas id="c"></canvas>
<script src="js/geom.js"></script>
<script src="js/sdf.js"></script>
<script src="js/engine.js"></script>
<script src="js/figures.js"></script>
<script src="js/scene-portrait.js"></script>
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  await document.fonts.load('84px Pinyon');
  WC.scenes.portrait.LY.remeasure();
  const eng = new WC.Engine(document.getElementById('c'), { width: 1920, height: 1080, scale: +(q.get('scale') || 1), paperSeed: 3 });
  const t0 = performance.now();
  const M = WC.scenes.portrait.build(eng);
  const t1 = performance.now();
  WC.scenes.portrait.render(eng, M, 0);
  eng.gl.finish();
  console.log('build', (t1 - t0).toFixed(0), 'ms; render', (performance.now() - t1).toFixed(0), 'ms');
  window.__done = true;
})().catch((e) => { console.log('ERR', e.stack || e.message); window.__done = true; });
</script></body></html>
